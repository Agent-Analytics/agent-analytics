services:
  agent-analytics:
    build: .
    image: agent-analytics:local
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      DB_PATH: /data/analytics.db
      API_KEYS: ${API_KEYS:-dev-read-key}
      PROJECT_TOKENS: ${PROJECT_TOKENS:-dev-project-token}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - agent_analytics_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  agent_analytics_data:
