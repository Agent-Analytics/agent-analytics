# Example only. Adjust ingressClassName, host, TLS secret, and annotations for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-analytics
  labels:
    app.kubernetes.io/name: agent-analytics
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - analytics.example.com
      secretName: agent-analytics-tls
  rules:
    - host: analytics.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-analytics
                port:
                  name: http
